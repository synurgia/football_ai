<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Football AI V1.2</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      width: 380px;
      min-height: 500px;
      background: #f4f6f8;
      color: #17202a;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 12px;
    }

    header {
      background: #111827;
      color: white;
      padding: 14px 16px;
    }

    header h1 {
      margin: 0;
      font-size: 17px;
    }

    header p {
      margin: 3px 0 0;
      font-size: 9px;
      opacity: .7;
    }

    .status {
      padding: 8px 12px;
      background: white;
      border-bottom: 1px solid #e5e7eb;
      font-size: 9px;
      color: #6b7280;
    }

    #predictions {
      padding: 8px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }

    .card {
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 8px;
      min-height: 82px;
    }

    .teams {
      font-size: 10px;
      font-weight: 700;
      line-height: 1.25;
    }

    .vs {
      color: #9ca3af;
      font-size: 8px;
      margin: 2px 0;
    }

    .outcome {
      margin-top: 6px;
      padding-top: 5px;
      border-top: 1px solid #f0f1f3;
      font-size: 9px;
    }

    .score {
      margin-top: 3px;
      font-size: 11px;
      font-weight: 700;
    }

    .empty,
    .error {
      grid-column: 1 / -1;
      background: white;
      border-radius: 8px;
      padding: 20px;
      text-align: center;
      color: #6b7280;
    }
  </style>
</head>

<body>
  <header>
    <h1>Football AI</h1>
    <p>V1.2 Daily Predictions</p>
  </header>

  <div class="status">
    Backend: 127.0.0.1:8000
  </div>

  <section id="predictions">
    <div class="empty">Loading predictions...</div>
  </section>
</body>
</html>
